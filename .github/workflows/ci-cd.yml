name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege for every job (MYF-27): the test jobs only read the code.
# `deploy` widens this for itself (id-token for Workload Identity Federation).
# Actions are pinned to a commit, the tag kept in a comment, so a moved tag
# can't change what runs here; bump both together.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres, the engine production runs, for the schema check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      # MYF-34: lint, formatting and types (ruff.toml, mypy.ini).
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      # MYF-19: production's schema comes from Alembic alone (no create_all or
      # sync_schema at startup there), so the migrations must build exactly
      # what models.py describes: `alembic check` fails on any difference.
      - name: Migrations match models.py
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          alembic upgrade head
          alembic check
      - run: pytest

  # npm audit runs in its own job, which `deploy` does not wait on: an outage
  # of npm's audit service must not block a release that changed no code.
  # A finding still shows as a red job on the run.
  audit-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit attempt $attempt failed (registry issue?), retrying in 15s..."
            sleep 15
          done
          exit 1

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "src/api/schema.d.ts is stale: run 'npm run gen:api' in frontend/ and commit it."
            exit 1
          }
      - run: npm run lint
      - run: npm run build
      - run: npm test

  test-e2e:
    # Pinned: ubuntu-latest moved to 26.04, which the pinned Playwright
    # (e2e/package.json) can't install Chromium on. Move both together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm', cache-dependency-path: e2e/package-lock.json }
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy:
    needs: [test-backend, test-frontend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Two merges in quick succession must not deploy (and migrate) at once:
    # the second waits for the first instead of racing it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Build & push backend
        run: |
          docker build -t ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} backend
          docker push ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }}

      - name: Build & push frontend
        run: |
          docker build --build-arg VITE_API_URL=/api \
            -f frontend/Dockerfile \
            -t ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/frontend:${{ github.sha }} .
          docker push ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/frontend:${{ github.sha }}

      - name: Run database migrations
        run: |
          gcloud run jobs deploy myfinance-migrate \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.BACKEND_SA_EMAIL }} \
            --set-cloudsql-instances=${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }} \
            --set-secrets=DATABASE_URL=myfinance-database-url:latest \
            --command=alembic \
            --args=upgrade,head \
            --max-retries=0 \
            --quiet
          gcloud run jobs execute myfinance-migrate --region=${{ vars.REGION }} --wait

      # Report only (MYF-19): production's schema used to be patched at startup
      # by sync_schema() too, so say here whether it still differs from
      # models.py. A difference shows as a failed step but never stops the
      # deploy; the fix for one is a migration.
      - name: Check production schema against models.py
        continue-on-error: true
        run: |
          gcloud run jobs deploy myfinance-schema-check \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.BACKEND_SA_EMAIL }} \
            --set-cloudsql-instances=${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }} \
            --set-secrets=DATABASE_URL=myfinance-database-url:latest \
            --command=alembic \
            --args=check \
            --max-retries=0 \
            --quiet
          gcloud run jobs execute myfinance-schema-check --region=${{ vars.REGION }} --wait

      - name: Deploy backend
        run: |
          gcloud run deploy myfinance-backend \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.BACKEND_SA_EMAIL }} \
            --add-cloudsql-instances=${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }} \
            --set-secrets=DATABASE_URL=myfinance-database-url:latest,ONEDRIVE_CLIENT_SECRET=myfinance-onedrive-client-secret:latest,ONEDRIVE_TOKEN_ENCRYPTION_KEY=myfinance-onedrive-token-key:latest,ONEDRIVE_SCHEDULER_SECRET=myfinance-onedrive-scheduler-secret:latest,ENABLE_BANKING_PRIVATE_KEY=myfinance-enablebanking-private-key:latest,BANK_SYNC_SCHEDULER_SECRET=myfinance-bank-sync-scheduler-secret:latest,SMTP_PASSWORD=myfinance-smtp-password:latest \
            --set-env-vars=CORS_ALLOWED_ORIGINS=https://${{ vars.DOMAIN }},FRONTEND_BASE_URL=https://${{ vars.DOMAIN }},ONEDRIVE_CLIENT_ID=${{ vars.ONEDRIVE_CLIENT_ID }},ONEDRIVE_REDIRECT_URI=https://${{ vars.DOMAIN }}/api/onedrive/auth/callback,ENABLE_BANKING_APPLICATION_ID=${{ vars.ENABLE_BANKING_APPLICATION_ID }},ENABLE_BANKING_REDIRECT_URL=https://${{ vars.DOMAIN }}/api/bank-sync/callback,SMTP_HOST=${{ vars.SMTP_HOST || 'smtp-relay.brevo.com' }},SMTP_PORT=${{ vars.SMTP_PORT || '587' }},SMTP_USERNAME=${{ vars.SMTP_USERNAME }},ALERT_FROM_ADDRESS=${{ vars.ALERT_FROM_ADDRESS || 'myfinance@olivex.fr' }} \
            --no-allow-unauthenticated \
            --ingress=internal-and-cloud-load-balancing \
            --min-instances=${{ vars.BACKEND_MIN_INSTANCES || '0' }} \
            --max-instances=2 \
            --concurrency=10 \
            --timeout=120 \
            --memory=1Gi \
            --quiet

      - name: Deploy frontend
        run: |
          gcloud run deploy myfinance-frontend \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/frontend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.FRONTEND_SA_EMAIL }} \
            --no-allow-unauthenticated \
            --ingress=internal-and-cloud-load-balancing \
            --max-instances=2 \
            --quiet
