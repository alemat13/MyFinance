name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pytest

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit attempt $attempt failed (registry issue?), retrying in 15s..."
            sleep 15
          done
          exit 1
      - run: npm run build
      - run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm', cache-dependency-path: e2e/package-lock.json }
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy:
    needs: [test-backend, test-frontend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Build & push backend
        run: |
          docker build -t ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} backend
          docker push ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }}

      - name: Build & push frontend
        run: |
          docker build --build-arg VITE_API_URL=/api \
            -f frontend/Dockerfile \
            -t ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/frontend:${{ github.sha }} .
          docker push ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/frontend:${{ github.sha }}

      - name: Run database migrations
        run: |
          gcloud run jobs deploy myfinance-migrate \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.BACKEND_SA_EMAIL }} \
            --set-cloudsql-instances=${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }} \
            --set-secrets=DATABASE_URL=myfinance-database-url:latest \
            --command=alembic \
            --args=upgrade,head \
            --max-retries=0 \
            --quiet
          gcloud run jobs execute myfinance-migrate --region=${{ vars.REGION }} --wait

      - name: Deploy backend
        run: |
          gcloud run deploy myfinance-backend \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/backend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.BACKEND_SA_EMAIL }} \
            --add-cloudsql-instances=${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }} \
            --set-secrets=DATABASE_URL=myfinance-database-url:latest,ONEDRIVE_CLIENT_SECRET=myfinance-onedrive-client-secret:latest,ONEDRIVE_TOKEN_ENCRYPTION_KEY=myfinance-onedrive-token-key:latest,ONEDRIVE_SCHEDULER_SECRET=myfinance-onedrive-scheduler-secret:latest,ENABLE_BANKING_PRIVATE_KEY=myfinance-enablebanking-private-key:latest,BANK_SYNC_SCHEDULER_SECRET=myfinance-bank-sync-scheduler-secret:latest \
            --set-env-vars=CORS_ALLOWED_ORIGINS=https://${{ vars.DOMAIN }},FRONTEND_BASE_URL=https://${{ vars.DOMAIN }},ONEDRIVE_CLIENT_ID=${{ vars.ONEDRIVE_CLIENT_ID }},ONEDRIVE_REDIRECT_URI=https://${{ vars.DOMAIN }}/api/onedrive/auth/callback,ENABLE_BANKING_APPLICATION_ID=${{ vars.ENABLE_BANKING_APPLICATION_ID }},ENABLE_BANKING_REDIRECT_URL=https://${{ vars.DOMAIN }}/api/bank-sync/callback \
            --no-allow-unauthenticated \
            --ingress=internal-and-cloud-load-balancing \
            --max-instances=2 \
            --concurrency=10 \
            --timeout=120 \
            --memory=1Gi \
            --quiet

      - name: Deploy frontend
        run: |
          gcloud run deploy myfinance-frontend \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/myfinance/frontend:${{ github.sha }} \
            --region=${{ vars.REGION }} \
            --service-account=${{ vars.FRONTEND_SA_EMAIL }} \
            --no-allow-unauthenticated \
            --ingress=internal-and-cloud-load-balancing \
            --max-instances=2 \
            --quiet
