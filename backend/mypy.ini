# Type checking for the backend (MYF-34): `mypy .` from backend/, run by CI.
# Lenient on purpose: the code base was never type-checked, so this checks
# what is annotated and the calls into it, without demanding annotations.
[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
exclude = (?x)(^alembic/ | ^migrations/ | ^tests/)

# The modules that already had type errors when mypy was introduced
# (67 errors, mostly Optional values the code knows are set). They are still
# parsed and their names typed for everyone else; only their own errors are
# silenced. Fix one, then take it off this list: the list only shrinks.
[mypy-bank_transactions,email_alerts,enable_banking,filtering,history,import_csv,onedrive,transaction_rules,routers.categories,routers.history,routers.imports,routers.transactions,schemas.backup,schemas.entities,schemas.imports,schemas.transactions]
ignore_errors = True
