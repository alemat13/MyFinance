# Type checking for the backend (MYF-34): `mypy .` from backend/, run by CI.
# Lenient on purpose: the code base was never type-checked, so this checks
# what is annotated and the calls into it, without demanding annotations.
[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
exclude = (?x)(^alembic/ | ^migrations/ | ^tests/ | ^models\.py$)

# models.py declares its columns the pre-2.0 way (`x = Column(...)`, not
# `Mapped[...]`), so mypy types every row attribute as a Column object and
# flags each read of one. Until it moves to Mapped[], its rows are left
# untyped (Any) for the modules that use them.
[mypy-models]
follow_imports = skip

# The modules that already had type errors when mypy was introduced
# (86 errors once models.py is left untyped, mostly Optional values the code
# knows are set and Sequence-vs-list). They are still
# parsed and their names typed for everyone else; only their own errors are
# silenced. Fix one, then take it off this list: the list only shrinks.
[mypy-backup,bank_transactions,database,email_alerts,enable_banking,filtering,history,import_csv,onedrive,routers.categories,routers.categorizer,routers.charts,routers.history,routers.imports,routers.split_weights,routers.tags,routers.transaction_links,routers.transaction_rules,routers.transactions,schemas.backup,schemas.entities,schemas.imports,schemas.transactions,serializers,tags,transaction_links,transaction_rules]
ignore_errors = True
